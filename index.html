<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Independence Day Check-in</title>

  <link rel="stylesheet" href="style.css">

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>
</head>

<body>

  <main class="container">

    <!-- =========================
         EVENT HEADER
    ========================== -->

    <section class="card">
      <h1>Independence Day Check-in</h1>

      <p class="subtitle">
        Live QR scanning, dashboard, and attendee search.
      </p>

      <label for="operator">
        Volunteer name
      </label>

      <input
        id="operator"
        type="text"
        placeholder="Enter your name"
        autocomplete="name"
      >
    </section>


    <!-- =========================
         DASHBOARD
    ========================== -->

    <section
      class="dashboard"
      aria-label="Check-in dashboard"
    >

      <div class="metric">
        <strong id="total">–</strong>
        <span>Registered</span>
      </div>

      <div class="metric">
        <strong id="checked">–</strong>
        <span>Checked in</span>
      </div>

      <div class="metric">
        <strong id="remaining">–</strong>
        <span>Remaining</span>
      </div>

    </section>


    <!-- =========================
         QR SCANNER
    ========================== -->

    <section class="card">

      <button
        id="startButton"
        type="button"
      >
        Start live scanner
      </button>

      <button
        id="stopButton"
        class="danger hidden"
        type="button"
      >
        Stop scanner
      </button>

      <div id="reader"></div>

      <p
        id="cameraMessage"
        class="small"
      >
        Allow camera access when prompted.
      </p>

    </section>


    <!-- =========================
         SCAN RESULT
    ========================== -->

    <section
      id="result"
      class="card result hidden"
    >

      <div id="resultTitle"></div>

      <div id="attendeeName"></div>

      <div id="ticketDetails"></div>

    </section>


    <!-- =========================
         SEARCH ATTENDEE
    ========================== -->

    <section class="card">

      <h2>Search attendee</h2>

      <div class="search-controls">

        <input
          id="searchBox"
          type="search"
          placeholder="Name, ticket ID, main registrant, or email"
          autocomplete="off"
        >

        <button
          id="searchButton"
          type="button"
        >
          Search
        </button>

      </div>

      <div id="searchResults"></div>

    </section>

  </main>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script src="app.js"></script>

</body>
</html>
